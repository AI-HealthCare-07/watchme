[project]
name = "watchme"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy",
    "psycopg[binary]",
    "reportlab",
    "tzdata",
    "httpx",
    "cryptography",
    "pillow",  # 자랑 카드 PNG (reportlab도 이미 씀)
]

[project.optional-dependencies]
dev = ["pytest", "pypdf"]
stats = ["pyreadstat", "pandas", "numpy"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["data/*.json", "fonts/*", "templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
