[project]
name = "watchme"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy",
    "psycopg[binary]",
    "reportlab",
    "qrcode[pil]",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pypdf"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
