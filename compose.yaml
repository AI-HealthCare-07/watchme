services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://watchme:${POSTGRES_PASSWORD}@db:5432/watchme
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # 카카오 연동 (셋 중 하나라도 비면 카카오 기능 꺼짐)
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      TOKEN_KEY: ${TOKEN_KEY:-}
      # AI 한 줄 요청 (키가 비면 AI 기능 꺼짐, 모델은 비우면 app/ai.py 기본값)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # 운영 지표 /admin (비면 꺼짐). METRICS_SINCE=YYYY-MM-DD 이전 체험은 지표에서 뺌
      ADMIN_KEY: ${ADMIN_KEY:-}
      METRICS_SINCE: ${METRICS_SINCE:-}
    ports:
      # 127.0.0.1에만 바인딩: Docker는 ufw를 우회하므로 외부 노출은 Funnel/Caddy로만
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      # LAN IP에만 바인딩: 0.0.0.0:443은 Tailscale Funnel(tailscale0:443)과 충돌.
      # 공유기 포트포워딩 80/443 → 이 IP (DHCP 고정 할당 필요)
      - "${LAN_IP}:80:80"
      - "${LAN_IP}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, edge]
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: watchme
      POSTGRES_DB: watchme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  edge:
    external: true # 다른 앱(DotWalk)과 Caddy를 공유. 서버에서 한 번: docker network create edge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
