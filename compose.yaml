services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://watchme:${POSTGRES_PASSWORD}@db:5432/watchme
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    ports:
      # 127.0.0.1에만 바인딩: Docker는 ufw를 우회하므로 외부 노출은 Funnel/Caddy로만
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      # LAN IP에만 바인딩: 0.0.0.0:443은 Tailscale Funnel(tailscale0:443)과 충돌.
      # 공유기 포트포워딩 80/443 → 이 IP (DHCP 고정 할당 필요)
      - "${LAN_IP}:80:80"
      - "${LAN_IP}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: watchme
      POSTGRES_DB: watchme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
