<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0ca678">
<title>{% block title %}Watchme{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="hero"><div class="hero-in">
  <a class="brand" href="/">WATCHME <small>{% block brand_note %}30일 생활습관 챌린지{% endblock %}</small></a>
  {% block hero %}{% endblock %}
</div></header>
{% set cta_html %}{% block cta %}{% endblock %}{% endset %}
<main class="sheet{{ '' if cta_html|trim else ' no-cta' }}">
  {% block sheet %}{% endblock %}
  <p class="foot">{{ DISCLAIMER }}</p>
</main>
{% if cta_html|trim %}<div class="cta"><div class="cta-in">{{ cta_html }}</div></div>{% endif %}
<script src="/static/flow.js" defer></script>
</body>
</html>
