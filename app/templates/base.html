<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>{% block title %}Watchme{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1f2933; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --accent-ink: #fff; --good: #15803d; --bad: #b91c1c; --soft: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --ink: #e5e7eb; --muted: #9ca3af; --line: #2a2f38;
            --accent: #60a5fa; --accent-ink: #0b1220; --good: #4ade80; --bad: #f87171; --soft: #222833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type=number] { width: 100%; font-size: 1.05rem; padding: 12px; border: 1px solid var(--line);
                       border-radius: 10px; background: var(--bg); color: var(--ink); }
  .seg { display: flex; gap: 8px; }
  fieldset.seg-wrap { border: 0; padding: 0; margin: 0; }
  fieldset.seg-wrap legend { font-weight: 600; margin: 12px 0 6px; padding: 0; }
  .seg label { flex: 1; margin: 0; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px;
               padding: 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .seg input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--soft); font-weight: 700; }
  button, .btn { display: block; width: 100%; text-align: center; font-size: 1.05rem; font-weight: 700; padding: 14px;
                 border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); text-decoration: none; cursor: pointer; }
  .btn.secondary, button.secondary { background: var(--soft); color: var(--ink); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row > * { flex: 1; }
  .error { color: var(--bad); font-weight: 600; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  td, th { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--line); }
  th { white-space: nowrap; width: 1%; padding-right: 12px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .grid a, .grid span { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; border-radius: 10px;
                        font-size: .85rem; text-decoration: none; color: var(--ink); background: var(--soft); border: 2px solid transparent; }
  .grid .kept { background: var(--good); color: #fff; }
  .grid .missed { background: var(--bad); color: #fff; }
  .grid .future { opacity: .35; }
  .grid .sel { border-color: var(--accent); }
  footer { margin-top: 28px; }
</style>
</head>
<body>
<main>
{% block body %}{% endblock %}
<footer><p class="muted">{{ DISCLAIMER }}</p></footer>
</main>
</body>
</html>
